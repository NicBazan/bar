name: bar
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bar
      POSTGRES_PASSWORD: bar_dev_password
      POSTGRES_DB: bar
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bar -d bar"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
