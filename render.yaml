# Blueprint de Render: API + worker del outbox (mismo Dockerfile).
# Postgres (Neon) y Redis (Upstash) se crean aparte y se cargan como variables.
services:
  - type: web
    name: bar-api
    runtime: docker
    dockerfilePath: infra/docker/api.Dockerfile
    dockerContext: .
    # starter (no free): el disco persistente de las fotos/3D requiere plan pago
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NFC_MASTER_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # URL pública de la carta (para los QR que arma el admin)
      - key: PUBLIC_GUEST_URL
        sync: false
      # Vercel + balanceador de Render: 2 saltos de proxy confiables (para el rate limit por IP)
      - key: TRUST_PROXY
        value: "2"
      - key: UPLOADS_DIR
        value: /data/uploads
    # Fotos y modelos 3D subidos desde el admin (los discos requieren plan pago en Render)
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1

  - type: worker
    name: bar-outbox-worker
    runtime: docker
    dockerfilePath: infra/docker/api.Dockerfile
    dockerContext: .
    dockerCommand: /entrypoint.sh worker
    plan: starter # los workers de Render no tienen plan free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
