# Blueprint de Render: API + worker del outbox (mismo Dockerfile).
# Postgres (Neon) y Redis (Upstash) se crean aparte y se cargan como variables.
services:
  - type: web
    name: bar-api
    runtime: docker
    dockerfilePath: infra/docker/api.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NFC_MASTER_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: worker
    name: bar-outbox-worker
    runtime: docker
    dockerfilePath: infra/docker/api.Dockerfile
    dockerContext: .
    dockerCommand: /entrypoint.sh worker
    plan: starter # los workers de Render no tienen plan free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
