# Blueprint de Render: API + worker del outbox (mismo Dockerfile).
# Postgres (Neon) y Redis (Upstash) se crean aparte y se cargan como variables.
services:
  - type: web
    name: bar-api
    runtime: docker
    dockerfilePath: infra/docker/api.Dockerfile
    dockerContext: .
    # free alcanza: las fotos y los 3D van a Cloudinary (sin Cloudinary haría falta disco y plan starter)
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NFC_MASTER_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # URL pública de la carta (para los QR que arma el admin)
      - key: PUBLIC_GUEST_URL
        sync: false
      # Vercel + balanceador de Render: 2 saltos de proxy confiables (para el rate limit por IP)
      - key: TRUST_PROXY
        value: "2"
      # Fotos y modelos 3D del admin: cloudinary://API_KEY:API_SECRET@CLOUD_NAME
      - key: CLOUDINARY_URL
        sync: false

  - type: worker
    name: bar-outbox-worker
    runtime: docker
    dockerfilePath: infra/docker/api.Dockerfile
    dockerContext: .
    dockerCommand: /entrypoint.sh worker
    plan: starter # los workers de Render no tienen plan free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
